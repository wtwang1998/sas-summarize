name: multi_encoding_converter

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/**.sas"
      - "multi_encoding_converter.py"
      - ".github/workflows/multi_encoding_version.yml"

permissions:
  contents: write

defaults:
  run:
    shell: bash -e {0}

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Run converter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python multi_encoding_converter.py --base-ref "$BASE_SHA" --head-ref "$HEAD_SHA"

      - name: Configure Git
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: ${{ steps.check_changes.outputs.has_changed == 'true' }}
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git add src/gbk src/utf8 src/gb2312 src/gb18030
          git commit -m "chore: multi encoding version"
          git rebase --onto "$HEAD_SHA" HEAD^ HEAD
          git push origin "HEAD:refs/heads/$HEAD_REF"
